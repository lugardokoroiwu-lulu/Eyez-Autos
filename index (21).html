<style>
/* Layout: fixed brand sidebar on desktop, stacked tab strip on phone; summary tiles over charts over records.
   Color: deep automotive navy ground, water-cyan accent, warm gold for money highlights; validated categorical ramp for charts. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#eef2f7;
  --fg:#111a27; --muted:#5a6b7e; --faint:#8696a8; --border:#dde4ec;
  --accent:#0e7490; --accent-ink:#ffffff; --accent-soft:#e0f2f7;
  --gold:#b45309; --gold-soft:#fdf2e3;
  --good:#15803d; --good-soft:#e7f5ec; --warn:#b45309; --bad:#be123c; --bad-soft:#fdeaef;
  --c1:#2563EB; --c2:#0D9488; --c3:#D97706; --c4:#7C3AED; --c5:#DB2777; --c6:#4F46E5;
  --grid:#e7edf3; --shadow:0 1px 2px rgba(16,26,39,.06),0 8px 24px rgba(16,26,39,.06);
  --r:14px; --r-sm:9px;
  --sans:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1118; --surface:#131a24; --surface-2:#171f2b; --surface-3:#1d2733;
  --fg:#e7edf4; --muted:#9fb0c2; --faint:#6f8295; --border:#263240;
  --accent:#22b8cf; --accent-ink:#06222a; --accent-soft:#12303a;
  --gold:#fbbf24; --gold-soft:#2a2112;
  --good:#4ade80; --good-soft:#12301f; --warn:#fbbf24; --bad:#fb7185; --bad-soft:#331219;
  --c1:#3B82F6; --c2:#0D9488; --c3:#D97706; --c4:#8B5CF6; --c5:#EC4899; --c6:#6366F1;
  --grid:#202a37; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c1118; --surface:#131a24; --surface-2:#171f2b; --surface-3:#1d2733;
  --fg:#e7edf4; --muted:#9fb0c2; --faint:#6f8295; --border:#263240;
  --accent:#22b8cf; --accent-ink:#06222a; --accent-soft:#12303a;
  --gold:#fbbf24; --gold-soft:#2a2112;
  --good:#4ade80; --good-soft:#12301f; --warn:#fbbf24; --bad:#fb7185; --bad-soft:#331219;
  --c1:#3B82F6; --c2:#0D9488; --c3:#D97706; --c4:#8B5CF6; --c5:#EC4899; --c6:#6366F1;
  --grid:#202a37; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
button{font-family:inherit;cursor:pointer}
a{color:var(--accent)}
.tnum{font-variant-numeric:tabular-nums}

/* shell */
[hidden]{display:none!important}
.app{display:flex;min-height:100%}
.side{width:230px;flex:0 0 230px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;align-self:flex-start;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;
  padding-left:max(18px,env(safe-area-inset-left,0px))}
.brand .logo{width:34px;height:34px;flex:0 0 34px}
.brand b{font-size:18px;letter-spacing:-.02em}
.brand small{display:block;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px;overflow:auto}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:transparent;
  color:var(--muted);padding:10px 12px;border-radius:10px;font-size:14.5px;font-weight:600}
.nav button svg{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;fill:none;stroke-width:1.9}
.nav button:hover{background:var(--surface-3);color:var(--fg)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.side .foot{margin-top:auto;padding:14px 16px;border-top:1px solid var(--border);color:var(--faint);font-size:11.5px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:12px 20px;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.topbar h2{font-size:18px}
.topbar .grow{flex:1}
.wrap{padding:20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  max-width:1180px;width:100%;margin:0 auto}
.hamb{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);color:var(--fg);
  padding:9px 14px;border-radius:10px;font-size:14px;font-weight:600}
.btn:hover{border-color:var(--faint)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--border))}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.iconbtn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px;display:inline-flex;color:var(--muted)}
.iconbtn:hover{color:var(--fg);border-color:var(--faint)}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

/* cards & tiles */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile .k{color:var(--muted);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.tile .k svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.tile .v{font-size:25px;font-weight:800;letter-spacing:-.02em;margin-top:7px;line-height:1.1}
.tile .sub{color:var(--faint);font-size:12px;margin-top:3px}
.tile.accent{border-left:3px solid var(--accent)}
.tile.gold .v{color:var(--gold)}
.tile.good .v{color:var(--good)} .tile.bad .v{color:var(--bad)}

.sec-h{display:flex;align-items:center;gap:10px;margin:22px 2px 10px}
.sec-h h3{font-size:15.5px}
.sec-h .grow{flex:1}
.muted{color:var(--muted)} .faint{color:var(--faint)}

/* forms */
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;font-family:inherit;font-size:14.5px;color:var(--fg);background:var(--surface-2);
  border:1px solid var(--border);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field{margin-bottom:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.inline{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);
  font-weight:700;padding:11px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.thumb{width:40px;height:30px;border-radius:6px;object-fit:cover;border:1px solid var(--border);cursor:pointer;background:var(--surface-3)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.out{background:var(--surface-3);color:var(--muted)}
.pill.paid{background:var(--good-soft);color:var(--good)}
.pill.due{background:var(--bad-soft);color:var(--bad)}
.pill.wt{background:var(--accent-soft);color:var(--accent)}
.pill.part{background:var(--gold-soft);color:var(--gold)}
.pill.m{background:var(--surface-3);color:var(--muted);font-weight:700}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:0 0 9px}

/* chips/segmented */
.seg{display:inline-flex;background:var(--surface-3);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* empty */
.empty{text-align:center;color:var(--faint);padding:34px 16px;font-size:14px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(6,12,20,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:40}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);
  width:100%;max-width:460px;max-height:88vh;overflow:auto}
.modal.lg{max-width:620px}
.modal .mh{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
.modal .mh h3{flex:1;font-size:16px}
.modal .mb{padding:18px}
.modal .mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--border);flex-wrap:wrap}

/* photo */
.photo-slot{border:1.5px dashed var(--border);border-radius:12px;background:var(--surface-2);min-height:120px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px;color:var(--faint);
  text-align:center;padding:14px;position:relative;overflow:hidden}
.photo-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-slot svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6}

/* banner */
.banner{display:flex;align-items:center;gap:10px;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 35%,var(--border));

/* chart */

/* auth */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.auth-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:22px}

/* camera */
.photo-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

.photo-slot.live{min-height:0;aspect-ratio:4/3;padding:0;border-style:solid;border-color:var(--accent);background:#000;cursor:default}

.photo-slot .cam-guide{inset:8% 5%}
.ic-count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:72px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:none}
.ic-hint{position:absolute;top:8px;left:0;right:0;text-align:center;color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 3px #000}

.attrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer}

.cam{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column;color:#fff;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.cam-stage{position:relative;flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cam-stage video,.cam-stage img{width:100%;height:100%;object-fit:contain;background:#000}
.cam-guide{position:absolute;inset:14% 6%;border:2px dashed rgba(255,255,255,.45);border-radius:18px;pointer-events:none}
.cam-hint{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:13px;font-weight:600;text-shadow:0 1px 3px #000}
.cam-bar{display:flex;align-items:center;justify-content:space-around;padding:18px 12px 22px;background:#000}
.cam-btn{width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.cam-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
.cam-shutter{width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #000;cursor:pointer}

.btn.outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent);font-weight:700}
.btn.outline:hover{background:var(--accent-soft)}
.cashcard .cash-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--border)}
.cash-t{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;flex:1;min-width:150px}
.cash-t svg{width:22px;height:22px;stroke:var(--good);fill:none;stroke-width:2}
.cash-acts{display:flex;gap:8px;flex-wrap:wrap}
.cash-acts svg,.cashcard .btn svg{width:15px;height:15px}
.cash-sum{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:14px;padding:14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border)}
.cash-big{font-size:28px;font-weight:800;letter-spacing:-.02em;color:var(--accent)}
.cash-grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 16px;font-size:13px}
.cash-grid>div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--border);padding:3px 0}
table.mini{width:100%;border-collapse:collapse;font-size:13px}
table.mini th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);padding:6px 6px;border-bottom:1px solid var(--border)}
table.mini td{padding:7px 6px;border-bottom:1px solid var(--border);vertical-align:top}
.ceo-sec{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.ceo-h{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.dashbar .seg button{white-space:nowrap}
.micon svg{width:17px;height:17px;fill:none;stroke:var(--muted);stroke-width:1.8;vertical-align:-4px}
#dashcols>.card{min-width:0;overflow-x:auto}
.ceo .tiles{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.cloudchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.cloudchip .cdot{width:8px;height:8px;border-radius:50%;flex:none}
@media (max-width:560px){.cloudchip .ctext{display:none}.cloudchip{padding:7px}}
@media print{.side,.topbar,.btn,.iconbtn,.seg,.installbar,.banner,.toast,.cloudchip{display:none!important}.main,.wrap{padding:0!important;margin:0!important}.card,.tile{box-shadow:none!important}}
.updbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:300;display:flex;align-items:center;gap:10px;background:#0b2b35;color:#fff;border-radius:14px;padding:10px 12px 10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:14px;width:min(520px,calc(100vw - 24px));box-sizing:border-box}
.updbar span{flex:1;line-height:1.35}
.updbar .btn{white-space:nowrap}
.updbar .iconbtn{color:#fff;background:transparent;border-color:rgba(255,255,255,.25)}
.installbar svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8}
.installbar{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:13.5px}
</style>
</head>
<body>

<div id="authroot" hidden></div>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand">
      <span class="logo" id="logo"></span>
      <div><b>Eyez Autos</b><small>Car Wash · v<span class="appver"></span></small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="sidefoot"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="iconbtn hamb" id="hamb" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <h2 id="ptitle">Dashboard</h2>
      <div class="grow"></div>
      <button class="cloudchip" id="cloudchip" title="Cloud status"></button>
      <button class="iconbtn" id="printbtn" aria-label="Print this page" title="Print this page"><svg viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></button>
      <button class="iconbtn" id="themebtn" aria-label="Toggle theme" title="Toggle light / dark"><svg id="themeicon" viewBox="0 0 24 24"></svg></button>
      <button class="btn primary" id="newwash"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New Wash</span></button>
    </header>
    <div class="wrap" id="view"></div>
  </div>
</div>
<div id="modalroot"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ---------------- storage ---------------- */
var KEY="eyez_autos_v1";
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return null;}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(DB));return true;}catch(e){return false;}}
function save(){if(!persist()&&!(typeof CLOUD!=="undefined"&&CLOUD.ready)){toast("Storage full — remove old photos or records");}renderFoot();if(typeof CLOUD!=="undefined"&&CLOUD.ready)cloudPushSoon();}

var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);};

/* ---------------- defaults & seed ---------------- */
var DEFAULT_TYPES=[
  {key:"out",   label:"Body wash (Out only)", price:800},
  {key:"in",    label:"Interior (In only)",   price:1000},
  {key:"inout", label:"In & Out",             price:1500},
  {key:"under", label:"Underwash",            price:1200},
  {key:"full",  label:"Full (In, Out & Under)",price:2500}
];
var DEFAULT_STAFF=["Awilo","Chima","Clinton","Ejima","Daddy boy","Tony"];
var EXP_CATS=["Water","Soap & Chemicals","Equipment","Rent","Electricity/Fuel","Staff allowance","Repairs","Miscellaneous"];
var PAY_METHODS=["Cash","POS","Transfer"];
var DEFAULT_SOAP=[{key:"s1",label:"Liquid soap (1 litre)",price:1500},{key:"s4",label:"Liquid soap (4 litres)",price:5000}];
function payStatus(w){var a=+w.amount||0,p=+(w.paid==null?a:w.paid)||0;if(p<=0)return"unpaid";if(p>=a)return"paid";return"partial";}
function outstanding(w){var a=+w.amount||0,p=+(w.paid==null?a:w.paid)||0;return Math.max(0,a-p);}
function amountPaid(w){var a=+w.amount||0;return +(w.paid==null?a:w.paid)||0;}
var STATUS_LABEL={paid:"Paid",partial:"Part-paid",unpaid:"Unpaid"};
var CARS=["Toyota Corolla","Toyota Camry","Honda Accord","Lexus RX 350","Mercedes GLK","Hyundai Elantra","Kia Sportage","Toyota Hilux","Ford Edge","Innoson IVM"];
var COLORS=["Black","Silver","White","Grey","Blue","Red"];

function seed(){
  var staff=DEFAULT_STAFF.map(function(n){return {id:uid(),name:n,active:true};});
  var washes=[],expenses=[];
  var now=new Date();
  for(var d=9;d>=0;d--){
    var day=new Date(now); day.setDate(now.getDate()-d);
    var n=2+Math.floor(Math.random()*5);
    for(var i=0;i<n;i++){
      var t=DEFAULT_TYPES[Math.floor(Math.random()*DEFAULT_TYPES.length)];
      var s=staff[Math.floor(Math.random()*staff.length)];
      var dt=new Date(day); dt.setHours(8+Math.floor(Math.random()*9),Math.floor(Math.random()*60),0,0);
      var r=Math.random(),paid=r<0.12?0:(r<0.22?Math.round(t.price*0.5):t.price);
      washes.push({id:uid(),date:dt.toISOString(),car:CARS[Math.floor(Math.random()*CARS.length)],
        color:COLORS[Math.floor(Math.random()*COLORS.length)],plate:"",
        typeKey:t.key,typeLabel:t.label,amount:t.price,staffId:s.id,staffName:s.name,
        method:PAY_METHODS[Math.floor(Math.random()*3)],paid:paid,
        photo:"",note:"",staffPaid:d>2});
    }
    if(d%3===0){expenses.push({id:uid(),date:day.toISOString(),cat:EXP_CATS[Math.floor(Math.random()*4)],
      desc:"Daily supplies",amount:500+Math.floor(Math.random()*6)*250});}
  }
  return {
    settings:{business:"Eyez Autos",currency:"₦",commission:0.5,types:DEFAULT_TYPES.slice(),pin:""},
    staff:staff, washes:washes, expenses:expenses,
    users:[{id:uid(),username:"admin",password:"admin123",role:"admin",name:"Administrator",staffId:null}],
    sample:true, theme:null
  };
}

var DB=load();
if(!DB){DB=seed();persist();}
if(!DB.settings.types) DB.settings.types=DEFAULT_TYPES.slice();
if(DB.settings.commission==null) DB.settings.commission=0.5;
if(!DB.users||!DB.users.length){DB.users=[{id:uid(),username:"admin",password:"admin123",role:"admin",name:"Administrator",staffId:null}];persist();}
DB.washes.forEach(function(w){if(w.method==null)w.method="Cash";if(w.paid==null)w.paid=+w.amount||0;});
function migrateSoap(){if(!DB.soapSales)DB.soapSales=[];if(!DB.fuel)DB.fuel=[];if(!DB.attendance)DB.attendance={};if(!DB.cashMoves)DB.cashMoves=[];if(!DB.payouts)DB.payouts=[];if(!DB.fuelCharges)DB.fuelCharges=[];DB.fuelCharges.forEach(function(c){if(!c.settlements)c.settlements=[];});if(DB.settings.fuelBlock==null)DB.settings.fuelBlock=5000;if(DB.settings.fuelLevy==null)DB.settings.fuelLevy=500;if(!DB.settings.soapProducts)DB.settings.soapProducts=DEFAULT_SOAP.slice();
  DB.soapSales.forEach(function(x){if(!x.settlements)x.settlements=[];});}
migrateSoap();persist();

/* ---------------- soap ledger helpers ---------------- */
function soapSettled(x){return sum(x.settlements||[],function(t){return +t.amount||0;});}
function soapOwed(x){return Math.max(0,(+x.amount||0)-soapSettled(x));}
function soapByHow(x,how){return sum((x.settlements||[]).filter(function(t){return t.how===how;}),function(t){return +t.amount||0;});}
function soapStatus(x){var o=soapOwed(x);if(o<=0)return soapByHow(x,"Deducted")>0?"deducted":"paid";return soapSettled(x)>0?"partial":"owing";}
function soapPill(x){var st=soapStatus(x);var m={deducted:["paid","Deducted"],paid:["paid","Paid cash"],partial:["part","Part-settled"],owing:["due","Owing"]}[st];
  return '<span class="pill '+m[0]+'">'+m[1]+'</span>';}
function staffSoap(id){return DB.soapSales.filter(function(x){return x.staffId===id;});}
function staffSoapOwed(id){return sum(staffSoap(id),soapOwed);}
function staffCommDue(id){return sum(DB.washes.filter(function(w){return w.staffId===id&&!w.staffPaid;}),commissionOf);}
/* generic settlement helpers (soap sales + fuel levy charges) */
function settledOf(x){return sum(x.settlements||[],function(t){return +t.amount||0;});}
function owedOf(x){return Math.max(0,(+x.amount||0)-settledOf(x));}
function isPendingDed(t){return t.how==="Deducted"&&t.netted===false;}
function staffFuel(id){return DB.fuelCharges.filter(function(c){return c.staffId===id;});}
function staffFuelOwed(id){return sum(staffFuel(id),owedOf);}
function itemsOf(id,kind){return kind==="soap"?staffSoap(id):kind==="fuel"?staffFuel(id):staffSoap(id).concat(staffFuel(id));}
/* deductions recorded but not yet netted against a commission payout */
function pendingDed(id,kind){return sum(itemsOf(id,kind),function(x){return sum((x.settlements||[]).filter(isPendingDed),function(t){return +t.amount||0;});});}
function availToDeduct(id){return Math.max(0,staffCommDue(id)-pendingDed(id));}
function settleList(list,amount,how,dateIso,note,netted){
  var left=+amount||0,applied=0;
  list.filter(function(x){return owedOf(x)>0;}).sort(function(a,b){return new Date(a.date)-new Date(b.date);}).forEach(function(x){
    if(left<=0)return;var take=Math.min(left,owedOf(x));
    var e={date:dateIso||new Date().toISOString(),amount:take,how:how,note:note||""};if(how==="Deducted")e.netted=!!netted;
    x.settlements.push(e);left-=take;applied+=take;});
  return applied;
}
function settleSoap(staffId,amount,how,dateIso,note,netted){return settleList(staffSoap(staffId),amount,how,dateIso,note,netted);}
function settleFuel(staffId,amount,how,dateIso,note,netted){return settleList(staffFuel(staffId),amount,how,dateIso,note,netted);}
function fuelDesc(c){var f=DB.fuel.find(function(x){return x.id===c.fuelId;});return f?"Fuel "+money(f.amount)+" bought "+fmtDate(f.date):"Fuel levy";}
/* every deduction entry for a staff member (or all), newest first */
function allDeductions(staffId,kind){var out=[];
  if(kind!=="fuel")DB.soapSales.forEach(function(x){if(staffId&&x.staffId!==staffId)return;
    (x.settlements||[]).forEach(function(t){if(t.how==="Deducted")out.push({kind:"soap",date:t.date,amount:+t.amount||0,note:t.note||"",item:x.product+" ×"+x.qty,itemDate:x.date,staffId:x.staffId,pending:isPendingDed(t)});});});
  if(kind!=="soap")DB.fuelCharges.forEach(function(c){if(staffId&&c.staffId!==staffId)return;
    (c.settlements||[]).forEach(function(t){if(t.how==="Deducted")out.push({kind:"fuel",date:t.date,amount:+t.amount||0,note:t.note||"",item:fuelDesc(c),itemDate:c.date,staffId:c.staffId,pending:isPendingDed(t)});});});
  return out.sort(byDateDesc);}
function soapDeductions(staffId){return allDeductions(staffId,"soap");}
function sameDay(a,b){return startOfDay(a).getTime()===startOfDay(b).getTime();}
function dayFuelTotal(dateStr){var d=new Date(dateStr+"T12:00:00");return sum(DB.fuel.filter(function(f){return sameDay(f.date,d);}),function(f){return +f.amount;});}
function dayLevyCharged(dateStr,staffId){var d=new Date(dateStr+"T12:00:00");return sum(DB.fuelCharges.filter(function(c){return c.staffId===staffId&&sameDay(c.date,d);}),function(c){return +c.amount;});}
function fuelUnits(amount){var b=+DB.settings.fuelBlock||5000;return Math.floor((+amount||0)/b);}
function dayWashers(dateStr){var d=new Date(dateStr+"T12:00:00");var r={start:startOfDay(d),end:endOfDay(d)};var cnt={};
  washesIn(r).forEach(function(w){cnt[w.staffId]=(cnt[w.staffId]||0)+1;});return cnt;}
function daySoapTakers(dateStr){var d=new Date(dateStr+"T12:00:00");var r={start:startOfDay(d),end:endOfDay(d)};var o={};
  soapIn(r).forEach(function(x){o[x.staffId]=true;});return o;}
function soapIn(r){return DB.soapSales.filter(function(x){var t=new Date(x.date);return t>=r.start&&t<=r.end;});}

/* ---------------- helpers ---------------- */
function cur(){return DB.settings.currency||"₦";}
function money(n){n=Math.round((+n||0));return (n<0?"−":"")+cur()+Math.abs(n).toLocaleString("en-NG");}
function money2(n){return cur()+(+n||0).toLocaleString("en-NG",{minimumFractionDigits:0,maximumFractionDigits:0});}
function commissionOf(w){return (+w.amount||0)*(DB.settings.commission||0);}
function companyOf(w){return (+w.amount||0)-commissionOf(w);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function startOfDay(d){d=new Date(d);d.setHours(0,0,0,0);return d;}
function endOfDay(d){d=new Date(d);d.setHours(23,59,59,999);return d;}
function fmtDate(iso){var d=new Date(iso);return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});}

/* ---------------- date range ---------------- */
function rangeFor(key,custom){
  var now=new Date(),s,e=endOfDay(now);
  if(key==="today"){s=startOfDay(now);}
  else if(key==="yesterday"){var y=new Date(now);y.setDate(now.getDate()-1);s=startOfDay(y);e=endOfDay(y);}
  else if(key==="week"){s=new Date(now);s.setDate(now.getDate()-6);s=startOfDay(s);}
  else if(key==="month"){s=new Date(now.getFullYear(),now.getMonth(),1);}
  else if(key==="all"){s=new Date(2000,0,1);}
  else if(key==="custom"&&custom){s=startOfDay(custom.from);e=endOfDay(custom.to);}
  else {s=startOfDay(now);}
  return {start:s,end:e};
}
function washesIn(r){return DB.washes.filter(function(w){var t=new Date(w.date);return t>=r.start&&t<=r.end;});}
function expInc(r){return DB.expenses.filter(function(x){var t=new Date(x.date);return t>=r.start&&t<=r.end;});}
function sum(a,f){return a.reduce(function(t,x){return t+(f?f(x):x);},0);}

/* ---------------- payments, cash book & CEO statement ---------------- */
/* every customer payment on a wash, dated: first payment at wash time, later ones from the payment log */
function paymentsOf(w){
  var log=w.payLog||[],logged=sum(log,function(p){return +p.amount||0;}),init=amountPaid(w)-logged,out=[];
  if(init>0)out.push({date:w.date,amount:init,method:w.method0||w.method||"Cash",w:w});
  log.forEach(function(p){out.push({date:p.date,amount:+p.amount||0,method:p.method||"Cash",w:w});});
  return out;
}
function paymentsIn(r){var out=[];DB.washes.forEach(function(w){paymentsOf(w).forEach(function(p){var t=new Date(p.date);if(t>=r.start&&t<=r.end)out.push(p);});});return out;}
function inR(d,r){var t=new Date(d);return t>=r.start&&t<=r.end;}
function settlementsIn(list,how,r){var t=0;list.forEach(function(x){(x.settlements||[]).forEach(function(s){if(s.how===how&&inR(s.date,r))t+=+s.amount||0;});});return t;}
/* cash flows in a period (cash only — POS and transfers go to the bank) */
function cashFlows(r){
  var f={};
  f.washCash=sum(paymentsIn(r).filter(function(p){return p.method==="Cash";}),function(p){return p.amount;});
  f.soapCash=settlementsIn(DB.soapSales,"Cash",r);
  f.fuelCash=settlementsIn(DB.fuelCharges,"Cash",r);
  f.added=sum(DB.cashMoves.filter(function(m){return m.type==="add"&&inR(m.date,r);}),function(m){return +m.amount;});
  f.expenses=sum(DB.expenses.filter(function(x){return (x.method||"Cash")==="Cash"&&inR(x.date,r);}),function(x){return +x.amount;});
  f.payouts=sum(DB.payouts.filter(function(p){return inR(p.date,r);}),function(p){return +p.cash;});
  f.reduced=sum(DB.cashMoves.filter(function(m){return m.type==="reduce"&&inR(m.date,r);}),function(m){return +m.amount;});
  f.deposited=sum(DB.cashMoves.filter(function(m){return m.type==="deposit"&&inR(m.date,r);}),function(m){return +m.amount;});
  f.inflow=f.washCash+f.soapCash+f.fuelCash+f.added;f.outflow=f.expenses+f.payouts+f.reduced+f.deposited;f.net=f.inflow-f.outflow;
  return f;
}
var EPOCH=new Date(2000,0,1);
function cashAt(endDate){return cashFlows({start:EPOCH,end:endOfDay(endDate)}).net;}
function dayRange(k){var d=new Date(k+"T12:00:00");return {start:startOfDay(d),end:endOfDay(d)};}

/* ---- the day's numbers, used by dashboard + CEO statement ---- */
function dayStats(k){
  var r=dayRange(k),ws=washesIn(r),ex=expInc(r),pays=paymentsIn(r);
  var st={k:k,r:r,ws:ws,ex:ex};
  st.cars=ws.length;st.rev=sum(ws,function(w){return +w.amount;});st.comm=sum(ws,commissionOf);
  st.collected=sum(ws,amountPaid);st.owedToday=sum(ws,outstanding);
  st.byMethod={};PAY_METHODS.forEach(function(m){var p=pays.filter(function(x){return x.method===m;});st.byMethod[m]={n:p.length,amt:sum(p,function(x){return x.amount;})};});
  st.received=sum(pays,function(p){return p.amount;});
  st.lateReceived=sum(pays.filter(function(p){return !inR(p.w.date,r);}),function(p){return p.amount;});
  st.types=DB.settings.types.map(function(t){var it=ws.filter(function(w){return w.typeKey===t.key;});return {label:t.label,n:it.length,amt:sum(it,function(w){return +w.amount;})};});
  var other=ws.filter(function(w){return !DB.settings.types.some(function(t){return t.key===w.typeKey;});});
  if(other.length)st.types.push({label:"Other",n:other.length,amt:sum(other,function(w){return +w.amount;})});
  st.staff=DB.staff.map(function(s){var it=ws.filter(function(w){return w.staffId===s.id;});return {s:s,n:it.length,amt:sum(it,function(w){return +w.amount;}),comm:sum(it,commissionOf),present:isPresent(k,s.id)};});
  st.exp=sum(ex,function(x){return +x.amount;});
  st.soap=sum(soapIn(r),function(x){return +x.amount;});
  st.fuelBought=sum(DB.fuel.filter(function(f){return inR(f.date,r);}),function(f){return +f.amount;});
  st.fuelLevy=sum(DB.fuelCharges.filter(function(c){return inR(c.date,r);}),function(c){return +c.amount;});
  st.profit=st.rev+st.soap+st.fuelLevy-st.comm-st.exp;
  st.cash=cashFlows(r);st.openCash=cashAt(new Date(r.start.getTime()-1));st.closeCash=st.openCash+st.cash.net;
  st.present=DB.staff.filter(function(s){return isPresent(k,s.id);});
  st.recvAll=sum(DB.washes.filter(function(w){return new Date(w.date)<=r.end;}),outstanding);
  st.staffOwed=sum(DB.staff,function(s){return Math.max(0,staffCommDue(s.id)-pendingDed(s.id));});
  return st;
}
function pct(a,b){return b>0?Math.round(a/b*100):0;}

/* ---- CEO statement ---- */

  var L=[],biz=DB.settings.business||"Eyez Autos";
  L.push(biz.toUpperCase()+" — CEO DAILY STATEMENT");L.push(new Date(st.k+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"2-digit",month:"long",year:"numeric"}));L.push("");
  L.push("CARS WASHED: "+st.cars);
  st.types.filter(function(t){return t.n;}).forEach(function(t){L.push("  "+t.label+": "+t.n+" ("+pct(t.n,st.cars)+"%) — "+money(t.amt));});
  L.push("");L.push("REVENUE: "+money(st.rev));
  L.push("MONEY RECEIVED: "+money(st.received));PAY_METHODS.forEach(function(m){L.push("  "+m+": "+money(st.byMethod[m].amt)+" ("+pct(st.byMethod[m].amt,st.received)+"%)");});
  if(st.owedToday)L.push("  Unpaid from today's washes: "+money(st.owedToday));
  L.push("");L.push("STAFF ("+st.present.length+" present)");
  st.staff.filter(function(x){return x.n||x.present;}).forEach(function(x){L.push("  "+x.s.name+(x.present?" ✓":"")+": "+x.n+" cars ("+pct(x.n,st.cars)+"%), commission "+money(x.comm));});
  L.push("");L.push("PROFIT & LOSS");
  L.push("  Washing revenue: "+money(st.rev));if(st.soap)L.push("  Soap sold to staff: "+money(st.soap));if(st.fuelLevy)L.push("  Fuel levy from staff: "+money(st.fuelLevy));
  L.push("  Less staff commission: −"+money(st.comm));L.push("  Less expenses: −"+money(st.exp)+(st.fuelBought?" (fuel "+money(st.fuelBought)+")":""));
  L.push("  NET "+(st.profit>=0?"PROFIT":"LOSS")+": "+money(st.profit));
  L.push("");L.push("CASH");L.push("  Opening: "+money(st.openCash));L.push("  In: "+money(st.cash.inflow)+" · Out: "+money(st.cash.outflow));
  if(st.cash.deposited)L.push("  Deposited to bank: "+money(st.cash.deposited));L.push("  Closing cash in hand: "+money(st.closeCash));
  L.push("");L.push("OUTSTANDING (as at this date)");L.push("  Customers owe: "+money(st.recvAll));L.push("  Staff pay owed now: "+money(st.staffOwed));
  return L.join("\n");
}

/* ---- charts ---- */
function lineChart(series){
  var W=720,H=200,padL=48,padR=14,padT=14,padB=26;
  var max=Math.max.apply(null,series.map(function(s){return s.val;}).concat([1]));
  var nice=niceMax(max);
  var n=series.length;
  var x=function(i){return padL+(W-padL-padR)*(n<=1?0:i/(n-1));};
  var y=function(v){return padT+(H-padT-padB)*(1-v/nice);};
  var pts=series.map(function(s,i){return x(i)+","+y(s.val);});
  var area="M"+x(0)+","+y(0)+" L"+pts.join(" L")+" L"+x(n-1)+","+y(0)+" Z";
  var line="M"+pts.join(" L");
  var ticks=4,g="";
  for(var t=0;t<=ticks;t++){var v=nice*t/ticks;var yy=y(v);
    g+='<line class="gridline" x1="'+padL+'" x2="'+(W-padR)+'" y1="'+yy+'" y2="'+yy+'"/>';
    g+='<text class="axis" x="'+(padL-6)+'" y="'+(yy+3)+'" text-anchor="end">'+shortNum(v)+'</text>';}
  var xl="";series.forEach(function(s,i){if(i%2===0||i===n-1){
    xl+='<text class="axis" x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle">'+new Date(s.d).toLocaleDateString("en-GB",{day:"2-digit",month:"short"}).replace(" "," ")+'</text>';}});
  var dots="";var last=series[n-1];
  dots='<circle cx="'+x(n-1)+'" cy="'+y(last.val)+'" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Revenue trend">'+g+
    '<path d="'+area+'" fill="var(--accent)" opacity="0.10"/>'+
    '<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+
    dots+xl+'</svg>';
}
function niceMax(m){if(m<=0)return 1;var p=Math.pow(10,Math.floor(Math.log10(m)));var d=m/p;var n=d<=1?1:d<=2?2:d<=5?5:10;return n*p;}
function shortNum(v){v=Math.round(v);if(v>=1e6)return (v/1e6).toFixed(v%1e6?1:0)+"M";if(v>=1e3)return (v/1e3).toFixed(v%1e3?1:0)+"k";return String(v);}

var CAM={stream:null,facing:"environment"};
function camSupported(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)&&window.isSecureContext!==false;}
function stopCam(){if(CAM.stream){CAM.stream.getTracks().forEach(function(t){t.stop();});CAM.stream=null;}}

/* ---------------- inline camera (inside the photo box) ---------------- */
var AUTO_SNAP_SECS=3;
function inlineCamera(slot,bar,onPhoto,onCancel,fallback){
  if(!camSupported()){fallback();return;}
  slot.classList.add("live");
  slot.innerHTML='<video id="icvid" autoplay playsinline muted></video><div class="cam-guide"></div><div class="ic-hint">Fit the whole car in the box, then tap Snap photo</div><div class="cam-flash" id="icflash"></div><div class="ic-count" id="iccount"></div>';
  var video=slot.querySelector("video"),shot=null,timer=null,done=false;
  function clearTimer(){if(timer){clearInterval(timer);timer=null;}}
  function countdown(){clearTimer();var n=AUTO_SNAP_SECS,el=document.getElementById("iccount");
    var go=function(){if(!document.getElementById("icvid")){clearTimer();return;}if(n<=0){clearTimer();if(el)el.textContent="";capture();return;}if(el)el.textContent=n;n--;};
    go();timer=setInterval(go,1000);}

  function liveControls(){
    bar.innerHTML='<button type="button" class="btn sm primary" id="ic_shot">'+svg('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor"/>')+'Snap photo</button>'+
      '<button type="button" class="btn sm" id="ic_flip">'+svg('<path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>')+'Switch camera</button>'+
      '<button type="button" class="btn sm ghost" id="ic_cancel">Cancel</button>';
    document.getElementById("ic_shot").onclick=function(){clearTimer();capture();};
    document.getElementById("ic_flip").onclick=function(){CAM.facing=CAM.facing==="environment"?"user":"environment";startCam(video,fail);};
    document.getElementById("ic_cancel").onclick=function(){clearTimer();stopCam();slot.classList.remove("live");onCancel();};
  }
  function fail(err){clearTimer();stopCam();slot.classList.remove("live");
    var denied=err&&(err.name==="NotAllowedError"||err.name==="SecurityError");
    toast(denied?"Camera permission blocked — opening phone camera":"Live camera unavailable — opening phone camera");
    onCancel();fallback();}
  function capture(){
    if(done)return;
    if(!video.videoWidth){toast("Camera is still starting…");return;}
    done=true;clearTimer();
    var max=1024,sc=Math.min(1,max/Math.max(video.videoWidth,video.videoHeight));
    var c=document.createElement("canvas");c.width=Math.round(video.videoWidth*sc);c.height=Math.round(video.videoHeight*sc);
    var ctx=c.getContext("2d");if(CAM.facing==="user"){ctx.translate(c.width,0);ctx.scale(-1,1);}
    ctx.drawImage(video,0,0,c.width,c.height);ctx.setTransform(1,0,0,1,0,0);stampPhoto(c);
    shot=c.toDataURL("image/jpeg",0.6);
    try{if(navigator.vibrate)navigator.vibrate(30);}catch(e){}
    var fl=document.getElementById("icflash");if(fl){fl.style.opacity=".85";}
    stopCam();
    setTimeout(function(){slot.classList.remove("live");onPhoto(shot);toast("Photo captured and attached");},150);
  }
  liveControls();startCam(video,fail);
}

function stampPhoto(canvas){
  try{var ctx=canvas.getContext("2d"),h=Math.max(22,Math.round(canvas.width*0.035));
    var txt=(DB.settings.business||"Eyez Autos")+" · "+new Date().toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
    ctx.font="600 "+Math.round(h*0.62)+"px system-ui,sans-serif";
    var w=ctx.measureText(txt).width+h;ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(canvas.width-w-8,canvas.height-h-8,w,h);
    ctx.fillStyle="#fff";ctx.textBaseline="middle";ctx.fillText(txt,canvas.width-w-8+h/2,canvas.height-8-h/2);}catch(e){}
}
function startCam(video,onFail){
  stopCam();
  navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:CAM.facing},width:{ideal:1920},height:{ideal:1080}}})
    .then(function(st){CAM.stream=st;video.srcObject=st;video.setAttribute("playsinline","");video.muted=true;
      var p=video.play();if(p&&p.catch)p.catch(function(){});
      video.style.transform=CAM.facing==="user"?"scaleX(-1)":"";})
    .catch(function(err){onFail(err);});
}
/* opens a full-screen live camera; onPhoto(dataUrl) on "Use photo"; fallback() opens the phone's own camera app */

  function liveBar(){

  function bindLive(){

    document.getElementById("camshot").onclick=capture;
  }
  function capture(){
    if(!video.videoWidth){toast("Camera is still starting…");return;}
    var max=1024,sc=Math.min(1,max/Math.max(video.videoWidth,video.videoHeight));
    var c=document.createElement("canvas");c.width=Math.round(video.videoWidth*sc);c.height=Math.round(video.videoHeight*sc);
    var ctx=c.getContext("2d");
    if(CAM.facing==="user"){ctx.translate(c.width,0);ctx.scale(-1,1);}
    ctx.drawImage(video,0,0,c.width,c.height);ctx.setTransform(1,0,0,1,0,0);stampPhoto(c);
    shot=c.toDataURL("image/jpeg",0.6);
    var fl=document.getElementById("camflash");fl.style.opacity=".85";setTimeout(function(){fl.style.opacity="0";},120);
    try{if(navigator.vibrate)navigator.vibrate(30);}catch(e){}
    stopCam();
    var stage=root.querySelector(".cam-stage");

    document.getElementById("cambar").innerHTML='<button class="cam-pill" id="camretake" style="background:rgba(255,255,255,.16);color:#fff">Retake</button>'+

      stage.innerHTML='<video id="camvid" autoplay playsinline muted></video><div class="cam-guide"></div><div class="cam-hint">Fit the whole car in the frame</div><div class="cam-flash" id="camflash"></div>';
      video=document.getElementById("camvid");liveBar();startCam(video,fail);};
    document.getElementById("camuse").onclick=function(){closeCam();onPhoto(shot);};
  }
  bindLive();
  startCam(video,fail);
}

function compress(file,cb){
  var img=new Image();var fr=new FileReader();
  fr.onload=function(){img.onload=function(){
    var max=1024,s=Math.min(1,max/Math.max(img.width,img.height));
    var c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    stampPhoto(c);try{cb(c.toDataURL("image/jpeg",0.6));}catch(e){cb("");}
  };img.onerror=function(){cb("");};img.src=fr.result;};
  fr.onerror=function(){cb("");};fr.readAsDataURL(file);
}

var washFilter={range:"week",staff:"",type:"",method:"",status:"",q:""};
function filterWashes(scopeMe){
  var r=rangeFor(washFilter.range);
  return washesIn(r).filter(function(w){
    if(scopeMe&&w.staffId!==myStaffId())return false;
    if(washFilter.staff&&w.staffId!==washFilter.staff)return false;
    if(washFilter.type&&w.typeKey!==washFilter.type)return false;
    if(washFilter.method&&(w.method||"Cash")!==washFilter.method)return false;
    if(washFilter.status&&payStatus(w)!==washFilter.status)return false;
    if(washFilter.q){var q=washFilter.q.toLowerCase();if((w.car+" "+w.plate+" "+w.color).toLowerCase().indexOf(q)<0)return false;}
    return true;
  }).sort(byDateDesc);
}

  html+='<div class="inline" style="margin-bottom:12px"><div class="seg" id="rcr">'+ranges.map(function(x){return '<button data-r="'+x[0]+'"'+(recRange===x[0]?' class="on"':'')+'>'+x[1]+'</button>';}).join("")+'</div></div>';

      (isAdmin()?' <button class="iconbtn" data-edit="'+w.id+'" title="Edit">'+svg('<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>')+'</button> <button class="iconbtn" data-del="'+w.id+'" title="Delete">'+svg('<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>')+'</button>':'')+'</td>'+
  '</tr>';}).join("");

      soapTk>0?'taken '+money(soapTk)+(pS>0?' · <span style="color:var(--bad)">−'+money(pS)+' deducted</span>':''):'none taken');
    h+=costRow('Fuel levy owed',money(fuelOw),fuelOw>0?'var(--bad)':'var(--faint)',fuelOw>0?dedBtn("fuel",s.id,false):null,

    html+='<div class="tablewrap"><table><thead><tr><th>Date deducted</th><th>Staff</th><th>Type</th><th>Item</th><th>Amount</th><th>Status</th></tr></thead><tbody>'+
      ded.map(function(d){return '<tr><td class="tnum" style="white-space:nowrap">'+fmtDT(d.date)+'</td><td><b>'+esc(staffName(d.staffId))+'</b></td>'+

     {t:"Cancel",fn:closeModal}]);

/* settle a staff member's whole balance (or part of it) */
/* deduct one cost type (soap or fuel) from a staff member's unpaid commission */
function deductModal(staffId,kind){
  var label=kind==="soap"?"liquid soap":"fuel levy";
  var owed=kind==="soap"?staffSoapOwed(staffId):staffFuelOwed(staffId),avail=availToDeduct(staffId);
  if(owed<=0){toast("Nothing owed for "+label);return;}
  var def=Math.min(owed,avail);
  modal("Deduct "+label+" — "+staffName(staffId),
    '<div class="card pad" style="background:var(--surface-2);box-shadow:none;margin-bottom:12px;font-size:13.5px">'+
      '<div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted">'+(kind==="soap"?"Liquid soap":"Fuel levy")+' owed</span><b class="tnum" style="color:var(--bad)">'+money(owed)+'</b></div>'+
      '<div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted">Commission available to deduct from</span><b class="tnum" style="color:var(--gold)">'+money(avail)+'</b></div></div>'+
    (avail>0?'<div class="field"><label class="f">Amount to deduct ('+cur()+')</label><input type="number" id="dd_amt" min="0" max="'+def+'" step="50" value="'+def+'"></div>'+
      '<div class="faint" style="font-size:12.5px">This comes off '+esc(staffName(staffId))+'’s next payout. Soap and fuel are deducted separately.</div>':
      '<div class="banner" style="margin:0"><span>'+esc(staffName(staffId))+' has no unpaid commission left to deduct from. If they paid you in cash instead, record it as cash.</span></div>'),
    [avail>0?{t:"Deduct",cls:"primary",fn:function(){
        var a=Math.min(def,+document.getElementById("dd_amt").value||0);if(a<=0){toast("Enter an amount");return true;}
        var fn=kind==="soap"?settleSoap:settleFuel;
        var ap=fn(staffId,a,"Deducted",new Date().toISOString(),"Deducted from commission",false);
        save();closeModal();toast(money(ap)+" "+label+" deducted from "+staffName(staffId));route();}}:null,
     {t:"Paid in cash",fn:function(){closeModal();cashModal(staffId,kind);}},
     {t:"Cancel",fn:closeModal}]);
}
function cashModal(staffId,kind){
  var owed=kind==="soap"?staffSoapOwed(staffId):staffFuelOwed(staffId);
  modal((kind==="soap"?"Liquid soap":"Fuel levy")+" paid in cash — "+staffName(staffId),
    '<div class="row2"><div class="field"><label class="f">Amount received ('+cur()+')</label><input type="number" id="cs_amt" min="0" step="50" value="'+owed+'"></div>'+
    '<div class="field"><label class="f">Date</label><input type="datetime-local" id="cs_date" value="'+toLocalInput(new Date())+'"></div></div>',
    [{t:"Record cash",cls:"primary",fn:function(){
      var a=Math.min(owed,+document.getElementById("cs_amt").value||0);if(a<=0){toast("Enter an amount");return true;}
      var fn=kind==="soap"?settleSoap:settleFuel;

function settleModal(staffId,how){if(how==="Deducted")deductModal(staffId,"soap");else cashModal(staffId,"soap");}
/* settle a single soap sale or fuel charge */
function settleOne(id,how,kind){
  kind=kind||"soap";
  var x=(kind==="soap"?DB.soapSales:DB.fuelCharges).find(function(y){return y.id===id;});if(!x)return;
  var ow=owedOf(x),amt=ow;
  if(how==="Deducted"){amt=Math.min(ow,availToDeduct(x.staffId));
    if(amt<=0){toast(staffName(x.staffId)+" has no unpaid commission to deduct from");return;}}
  confirmModal(how==="Deducted"?"Deduct from "+staffName(x.staffId)+"’s commission?":"Mark as paid in cash?",
    money(amt)+(amt<ow?" of "+money(ow):"")+" will be "+(how==="Deducted"?"deducted from the next payout.":"recorded as paid in cash."),function(){
      var e={date:new Date().toISOString(),amount:amt,how:how,note:how==="Deducted"?"Deducted from commission":""};if(how==="Deducted")e.netted=false;
      x.settlements.push(e);save();toast("Updated");route();});
}

/* pay commission: net of soap and fuel already deducted */
function openPayout(staffId){
  var comm=staffCommDue(staffId),pS=pendingDed(staffId,"soap"),pF=pendingDed(staffId,"fuel");
  var soapOw=staffSoapOwed(staffId),fuelOw=staffFuelOwed(staffId);
  if(comm<=0){toast("No commission due");return;}
  var net=Math.max(0,comm-pS-pF);
  function line(l,v,c){return '<div style="display:flex;justify-content:space-between;padding:4px 0"><span class="muted">'+l+'</span><b class="tnum" style="color:'+c+'">'+v+'</b></div>';}
  modal("Pay "+staffName(staffId),
    '<div class="card pad" style="background:var(--surface-2);box-shadow:none;margin-bottom:12px">'+
      line((DB.settings.commission*100)+"% commission due",money(comm),"var(--gold)")+
      line("Less: liquid soap deducted",pS>0?"−"+money(pS):money(0),"var(--bad)")+
      line("Less: fuel levy deducted",pF>0?"−"+money(pF):money(0),"var(--bad)")+
      '<div style="height:1px;background:var(--border);margin:6px 0"></div>'+
      '<div style="display:flex;justify-content:space-between;font-size:17px;font-weight:800"><span>Cash to hand over</span><span class="tnum">'+money(net)+'</span></div></div>'+
    ((soapOw+fuelOw)>0?'<div class="faint" style="font-size:12.5px">Not yet deducted: soap '+money(soapOw)+', fuel '+money(fuelOw)+'. Cancel and use the <b>Deduct</b> buttons first if you want them taken from this payout.</div>':''),
    [{t:"Confirm payout",cls:"primary",fn:function(){
      var now=new Date().toISOString();
      DB.washes.forEach(function(w){if(w.staffId===staffId&&!w.staffPaid){w.staffPaid=true;w.staffPaidOn=now;}});
      DB.payouts.push({id:uid(),date:now,staffId:staffId,commission:comm,deducted:pS+pF,soap:pS,fuel:pF,cash:net,cars:DB.washes.filter(function(w){return w.staffId===staffId&&w.staffPaidOn===now;}).length});
      itemsOf(staffId).forEach(function(x){(x.settlements||[]).forEach(function(t){if(isPendingDed(t)){t.netted=true;t.paidOn=now;}});});
      save();closeModal();toast("Paid "+money(net)+((pS+pF)>0?" ("+money(pS+pF)+" deducted)":""));route();}},
     {t:"Cancel",fn:closeModal}]);
}
function soapStatement(staffId){
  var list=staffSoap(staffId).slice().sort(byDateDesc);
  var taken=sum(list,function(x){return +x.amount;}),cash=sum(list,function(x){return soapByHow(x,"Cash");}),ded=sum(list,function(x){return soapByHow(x,"Deducted");}),ow=sum(list,soapOwed);
  var txt=DB.settings.business+" — Liquid soap statement\nStaff: "+staffName(staffId)+"\nDate: "+fmtDate(new Date())+"\n\n"+
    list.map(function(x){return fmtDate(x.date)+"  "+x.product+"  "+x.qty+" x "+money(x.unitPrice)+" = "+money(x.amount)+"  ["+soapStatus(x)+(soapOwed(x)>0?", bal "+money(soapOwed(x)):"")+"]";}).join("\n")+
    "\n\nTotal taken: "+money(taken)+"\nPaid cash: "+money(cash)+"\nDeducted from pay: "+money(ded)+"\nBalance owed: "+money(ow);
  textModal("Soap statement — "+staffName(staffId),"Copy and send to the staff member (e.g. on WhatsApp).",txt);

function soapCSV(list){
  var head=["Date","Staff","Product","Qty","Unit price","Amount","Paid cash","Deducted","Balance","Status","Note"];
  var rows=list.map(function(x){return [fmtDT(x.date),x.staffName||staffName(x.staffId),x.product,x.qty,x.unitPrice,x.amount,soapByHow(x,"Cash"),soapByHow(x,"Deducted"),soapOwed(x),soapStatus(x),x.note||""];});
  var csv=[head].concat(rows).map(function(r){return r.map(function(c){c=String(c==null?"":c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(",");}).join("\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="soap-ledger.csv";document.body.appendChild(a);a.click();a.remove();
}

/* ---- PAYMENT STATUS (what each staff was actually paid, after deductions) ---- */
/* split of a payout's deductions into soap and fuel (older payouts are worked out from the deduction records) */
function payoutSplit(p){
  if(p.soap!=null||p.fuel!=null)return {soap:+p.soap||0,fuel:+p.fuel||0};
  var s=0,f=0;
  staffSoap(p.staffId).forEach(function(x){(x.settlements||[]).forEach(function(t){if(t.how==="Deducted"&&t.paidOn===p.date)s+=+t.amount||0;});});
  staffFuel(p.staffId).forEach(function(x){(x.settlements||[]).forEach(function(t){if(t.how==="Deducted"&&t.paidOn===p.date)f+=+t.amount||0;});});
  if(s+f===0&&+p.deducted>0)return {soap:0,fuel:0,other:+p.deducted};
  return {soap:s,fuel:f};
}
function payoutCars(p){if(p.cars!=null)return p.cars;return DB.washes.filter(function(w){return w.staffId===p.staffId&&w.staffPaidOn===p.date;}).length;}
var psState={q:"",range:"month",from:"",to:"",staff:""};
function psRange(){
  if(psState.range==="custom"&&psState.from&&psState.to)return {start:startOfDay(new Date(psState.from+"T12:00:00")),end:endOfDay(new Date(psState.to+"T12:00:00"))};
  return rangeFor(psState.range);
}
VIEWS.paystatus=function(){
  var r=psRange(),q=psState.q.trim().toLowerCase();
  var staffList=DB.staff.filter(function(s){return !q||s.name.toLowerCase().indexOf(q)>=0;});
  var ids={};staffList.forEach(function(s){ids[s.id]=1;});
  var pays=DB.payouts.filter(function(p){return ids[p.staffId]&&inR(p.date,r)&&(!psState.staff||p.staffId===psState.staff);}).sort(byDateDesc);
  /* hide inactive staff who weren't paid in this period (unless searched for by name) */
  staffList=staffList.filter(function(s){return s.active||q||pays.some(function(p){return p.staffId===s.id;})||staffCommDue(s.id)>0;});
  var tot={cash:0,comm:0,soap:0,fuel:0,other:0};

function printPayslip(id){
  var p=DB.payouts.find(function(x){return x.id===id;});if(!p)return;var sp=payoutSplit(p),cars=payoutCars(p);
  function r(l,v,b){return '<div style="display:flex;justify-content:space-between;padding:4px 0;'+(b?'font-weight:800;font-size:15px;border-top:2px solid #111;margin-top:6px;padding-top:8px':'border-bottom:1px dashed #ccc')+'"><span>'+l+'</span><span>'+v+'</span></div>';}
  var html='<div style="max-width:420px"><div style="font-size:16px;font-weight:800;margin-bottom:4px">Staff payslip</div>'+
    r("Staff",esc(staffName(p.staffId)))+r("Date paid",fmtDT(p.date))+(cars?r("Cars paid for",cars):'')+
    r((DB.settings.commission*100)+"% commission",money(p.commission))+

    (Math.round(+p.cash)!==expectedNet(p)?r(+p.cash>expectedNet(p)?"Extra paid":"Less: short-paid",(+p.cash>expectedNet(p)?"+":"−")+money(Math.abs(+p.cash-expectedNet(p)))):'')+

/* ---- edit / delete a staff payment (keeps cars, deductions and cash book linked) ---- */
function payoutLinks(p){
  var cars=DB.washes.filter(function(w){return w.staffId===p.staffId&&w.staffPaidOn===p.date;});
  var sets=[];itemsOf(p.staffId).forEach(function(x){(x.settlements||[]).forEach(function(t){if(t.how==="Deducted"&&t.paidOn===p.date)sets.push(t);});});
  return {cars:cars,sets:sets};
}
function expectedNet(p){return Math.max(0,(+p.commission||0)-(+p.deducted||0));}
function editPayout(id){
  var p=DB.payouts.find(function(x){return x.id===id;});if(!p)return;
  var sp=payoutSplit(p),exp=expectedNet(p);
  modal("Edit payment — "+staffName(p.staffId),
    '<div class="card pad" style="background:var(--surface-2);box-shadow:none;margin-bottom:12px;font-size:13.5px">'+
      '<div style="display:flex;justify-content:space-between;padding:2px 0"><span class="muted">'+(DB.settings.commission*100)+'% commission ('+payoutCars(p)+' cars)</span><b class="tnum">'+money(p.commission)+'</b></div>'+
      '<div style="display:flex;justify-content:space-between;padding:2px 0"><span class="muted">Less soap + fuel deducted</span><b class="tnum" style="color:var(--bad)">−'+money(sp.soap+sp.fuel+(sp.other||0))+'</b></div>'+
      '<div style="display:flex;justify-content:space-between;padding:2px 0"><span class="muted">Should be paid</span><b class="tnum">'+money(exp)+'</b></div></div>'+
    '<div class="row2"><div class="field"><label class="f">Date & time paid</label><input type="datetime-local" id="pe_date" value="'+toLocalInput(new Date(p.date))+'"></div>'+
    '<div class="field"><label class="f">Cash actually paid ('+cur()+')</label><input type="number" id="pe_cash" min="0" step="50" value="'+(+p.cash||0)+'"></div></div>'+
    '<div class="field"><label class="f">Note (optional)</label><input id="pe_note" value="'+esc(p.note||"")+'" placeholder="e.g. paid ₦500 extra as bonus"></div>'+
    '<div class="faint" id="pe_diff" style="font-size:12.5px"></div>',
    [{t:"Save changes",cls:"primary",fn:function(){
      var nd=document.getElementById("pe_date").value,cash=+document.getElementById("pe_cash").value;
      if(!nd){toast("Pick the date");return true;}if(!(cash>=0)){toast("Enter the amount paid");return true;}
      var newIso=new Date(nd).toISOString(),old=p.date;
      if(newIso!==old){var L=payoutLinks(p);
        L.cars.forEach(function(w){w.staffPaidOn=newIso;});L.sets.forEach(function(t){t.paidOn=newIso;});p.date=newIso;}
      p.cash=Math.round(cash);p.note=document.getElementById("pe_note").value.trim();p.edited=new Date().toISOString();
      save();closeModal();toast("Payment updated");route();}},
     {t:"Cancel",fn:closeModal}]);
  function diff(){var c=+document.getElementById("pe_cash").value||0,d=c-exp;
    document.getElementById("pe_diff").innerHTML=d===0?'Matches the amount due.':(d>0?'<span style="color:var(--gold)">'+money(d)+' more than due (shown as an extra on the payslip).</span>':'<span style="color:var(--bad)">'+money(-d)+' less than due.</span>');}
  document.getElementById("pe_cash").oninput=diff;diff();
}
function deletePayout(id){
  var p=DB.payouts.find(function(x){return x.id===id;});if(!p)return;
  var L=payoutLinks(p),ded=sum(L.sets,function(t){return +t.amount||0;});
  confirmModal("Delete this payment?","This cancels the "+money(p.cash)+" paid to "+staffName(p.staffId)+" on "+fmtDT(p.date)+". "+
    (L.cars.length?"The commission for "+L.cars.length+" car"+(L.cars.length===1?"":"s")+" goes back to unpaid. ":"")+
    (ded?money(ded)+" of soap/fuel deductions goes back to ‘awaiting payout’. ":"")+"The cash balance gets the "+money(p.cash)+" back.",function(){
      L.cars.forEach(function(w){w.staffPaid=false;delete w.staffPaidOn;});
      L.sets.forEach(function(t){t.netted=false;delete t.paidOn;});
      DB.payouts=DB.payouts.filter(function(x){return x.id!==id;});
      save();toast("Payment deleted — "+staffName(p.staffId)+" is back to ‘to pay’");route();});
}

/* ---- FINANCIAL REPORT ---- */
var repState={range:"today",from:toLocalInput(startOfDay(new Date())).slice(0,10),to:toLocalInput(new Date()).slice(0,10)};
VIEWS.report=function(){
  var custom=repState.range==="custom"?{from:new Date(repState.from),to:new Date(repState.to)}:null;
  var r=rangeFor(repState.range,custom);
  var ws=washesIn(r),ex=expInc(r),sp=soapIn(r);
  var rev=sum(ws,function(w){return +w.amount;}),com=sum(ws,commissionOf),exp=sum(ex,function(x){return +x.amount;});
  var soapRev=sum(sp,function(x){return +x.amount;});
  var fuelLev=sum(DB.fuelCharges.filter(function(c){var t=new Date(c.date);return t>=r.start&&t<=r.end;}),function(c){return +c.amount;});
  soapRev+=0;var profit=rev+soapRev+fuelLev-com-exp;
  var ranges=[["today","Today"],["yesterday","Yesterday"],["week","Last 7 days"],["month","This month"],["all","All time"],["custom","Custom"]];
  var html='<div class="inline" style="margin-bottom:6px"><div class="seg" id="rrange">'+ranges.map(function(x){return '<button data-r="'+x[0]+'"'+(repState.range===x[0]?' class="on"':'')+'>'+x[1]+'</button>';}).join("")+'</div></div>';
  if(repState.range==="custom"){
    html+='<div class="inline" style="margin-bottom:14px"><div><label class="f">From</label><input type="date" id="r_from" value="'+repState.from+'"></div>'+
      '<div><label class="f">To</label><input type="date" id="r_to" value="'+repState.to+'"></div></div>';
  }
  html+='<div class="faint" style="margin:8px 2px 14px;font-size:13px">'+fmtDate(r.start)+' — '+fmtDate(r.end)+' · '+ws.length+' washes</div>';

  html+='<div class="sec-h" style="margin-top:0"><h3>Payments collected</h3></div>'+methodTrays(ws);

function pnlRow(label,val,pos){

    '<span class="tnum" style="font-weight:700;color:'+(neg?'var(--bad)':'var(--fg)')+'">'+(neg?"−":"")+money(Math.abs(val))+'</span></div>';
}
function staffEarnBars(ws){
  var data=DB.staff.map(function(s,i){var items=ws.filter(function(w){return w.staffId===s.id;});return {name:s.name,earn:sum(items,commissionOf),i:i};})
    .filter(function(d){return d.earn>0;}).sort(function(a,b){return b.earn-a.earn;});
  if(!data.length)return '<div class="empty">No washes in this period.</div>';
  var max=Math.max.apply(null,data.map(function(d){return d.earn;}));
  return '<div class="bars2">'+data.map(function(d){return '<div class="barrow"><span class="nm">'+esc(d.name)+'</span><span class="track"><span class="fill" style="width:'+(d.earn/max*100)+'%;background:'+colorFor(d.i)+'"></span></span><span class="amt" style="color:var(--gold)">'+money(d.earn)+'</span></div>';}).join("")+'</div>';
}

/* ---------------- modals ---------------- */
function modal(title,bodyHtml,buttons){
  var btns=(buttons||[]).filter(Boolean).map(function(b,i){return '<button class="btn '+(b.cls||"ghost")+'" data-mb="'+i+'">'+esc(b.t)+'</button>';}).join("");
  document.getElementById("modalroot").innerHTML='<div class="scrim" id="scrim"><div class="modal"><div class="mh"><h3>'+esc(title)+'</h3><button class="iconbtn" id="mx">'+svg('<path d="M18 6 6 18M6 6l12 12"/>')+'</button></div><div class="mb">'+bodyHtml+'</div><div class="mf">'+btns+'</div></div></div>';
  var list=(buttons||[]).filter(Boolean);
  document.querySelectorAll("[data-mb]").forEach(function(b){b.onclick=function(){var keep=list[+b.dataset.mb].fn();if(!keep)return;};});
  document.getElementById("mx").onclick=closeModal;
  document.getElementById("scrim").onclick=function(e){if(e.target.id==="scrim")closeModal();};
}
function closeModal(){if(typeof stopCam==="function")stopCam();document.getElementById("modalroot").innerHTML="";}
function confirmModal(title,msg,onYes){
  modal(title,'<div style="font-size:14px;color:var(--muted)">'+esc(msg)+'</div>',
    [{t:"Yes, continue",cls:"danger",fn:function(){closeModal();onYes();}},{t:"Cancel",fn:closeModal}]);
}
function textModal(title,hint,text){
  document.getElementById("modalroot").innerHTML='<div class="scrim" id="scrim"><div class="modal lg"><div class="mh"><h3>'+esc(title)+'</h3><button class="iconbtn" id="mx">'+svg('<path d="M18 6 6 18M6 6l12 12"/>')+'</button></div><div class="mb"><div class="faint" style="font-size:12.5px;margin-bottom:8px">'+esc(hint)+'</div><textarea id="txtout" rows="8" readonly style="font-family:var(--mono);font-size:12px">'+esc(text)+'</textarea></div><div class="mf"><button class="btn primary" id="cpy">Copy</button><button class="btn" id="tprint">'+svg(IC.print)+'Print</button><button class="btn" id="cls">Close</button></div></div></div>';
  document.getElementById("mx").onclick=closeModal;document.getElementById("cls").onclick=closeModal;
  document.getElementById("scrim").onclick=function(e){if(e.target.id==="scrim")closeModal();};
  document.getElementById("tprint").onclick=function(){printHTML(title,'<pre style="font-family:var(--mono);font-size:12.5px;white-space:pre-wrap">'+esc(text)+'</pre>');};
  document.getElementById("cpy").onclick=function(){var ta=document.getElementById("txtout");ta.select();copyText(text);};
}
function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){toast("Copied");},function(){fallbackCopy(text);});
  }else fallbackCopy(text);
}
function fallbackCopy(text){
  var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");toast("Copied");}catch(e){toast("Select the text and copy");}document.body.removeChild(ta);
}
function photoModal(id){
  var w=DB.washes.find(function(x){return x.id===id;});if(!w||!w.photo)return;
  document.getElementById("modalroot").innerHTML='<div class="scrim" id="scrim"><div class="modal lg"><div class="mh"><h3>'+esc(w.car||"Car")+'</h3><button class="iconbtn" id="mx">'+svg('<path d="M18 6 6 18M6 6l12 12"/>')+'</button></div><div class="mb" style="padding:0"><img src="'+w.photo+'" style="width:100%;display:block" alt="car"></div></div></div>';
  document.getElementById("mx").onclick=closeModal;document.getElementById("scrim").onclick=function(e){if(e.target.id==="scrim")closeModal();};

/* record customer payment */
function openPay(id){
  var w=DB.washes.find(function(x){return x.id===id;});if(!w)return;
  var bal=outstanding(w);
  modal("Record payment",
    '<div class="faint" style="font-size:13px;margin-bottom:12px">'+esc(w.car||"Car")+' · charged '+money(w.amount)+' · balance <b style="color:var(--bad)">'+money(bal)+'</b></div>'+
    '<div class="row2"><div class="field"><label class="f">Amount received now ('+cur()+')</label><input type="number" id="pay_amt" min="0" step="50" value="'+bal+'"></div>'+
    '<div class="field"><label class="f">Payment method</label><select id="pay_method">'+PAY_METHODS.map(function(m){return '<option'+((w.method||"Cash")===m?' selected':'')+'>'+m+'</option>';}).join("")+'</select></div></div>',
    [{t:"Record payment",cls:"primary",fn:function(){
      var add=+document.getElementById("pay_amt").value||0;if(add<=0){toast("Enter an amount");return true;}
      var before=amountPaid(w),nm=document.getElementById("pay_method").value;add=Math.min(add,Math.max(0,(+w.amount||0)-before));if(add<=0){toast("Already fully paid");return true;}
      if(!w.payLog){w.payLog=[];w.method0=w.method||"Cash";}
      w.payLog.push({date:new Date().toISOString(),amount:add,method:nm});
      w.paid=before+add;w.method=nm;
      save();closeModal();toast("Payment recorded — "+money(add));route();}},
     {t:"Cancel",fn:closeModal}]);
}

/* edit wash modal */
function editWash(id){
  var w=DB.washes.find(function(x){return x.id===id;});if(!w)return;photoTmp=w.photo||"";
  modal("Edit wash",washForm(w),[
    {t:"Save changes",cls:"primary",fn:function(){var d=readWashForm();if(!d.car){toast("Enter the car");return true;}
      if(!isAdmin()){d.staffId=myStaffId();d.staffName=staffName(myStaffId());}
      Object.assign(w,d);w.photo=photoTmp||"";save();closeModal();toast("Updated");route();}},
    {t:"Cancel",fn:closeModal}]);
  bindWashForm();lockStaffField();
}

/* ---------------- global events ---------------- */
document.addEventListener("click",function(e){
  var g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return;}
  var rc=e.target.closest("[data-receipt]");if(rc){printReceipt(rc.dataset.receipt);return;}
  var ph=e.target.closest("[data-photo]");if(ph){photoModal(ph.dataset.photo);return;}
  var ed=e.target.closest("[data-edit]");if(ed){if(isAdmin())editWash(ed.dataset.edit);return;}
  var dl=e.target.closest("[data-del]");if(dl){if(!isAdmin())return;var id=dl.dataset.del;confirmModal("Delete this wash?","This removes the record permanently.",function(){DB.washes=DB.washes.filter(function(x){return x.id!==id;});save();route();});return;}

var APP_VERSION="3.3";

function verNum(v){return String(v).split(".").map(function(x){return +x||0;});}
function verNewer(a,b){var x=verNum(a),y=verNum(b);for(var i=0;i<Math.max(x.length,y.length);i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0);}return false;}

    UPD.busy=false;var m=t.match(/var APP_VERSION="([0-9.]+)"/);if(!m){if(manual)toast("Couldn’t check for updates");return;}
    if(verNewer(m[1],APP_VERSION))showUpdateBar(m[1]);else if(manual)toast("You have the latest version (v"+APP_VERSION+")");
  }).catch(function(){UPD.busy=false;if(manual)toast("No internet — can’t check for updates");});
}

  document.getElementById("upd_x").onclick=function(){b.remove();};
}

function cloudStop(){CLOUD.unsub.forEach(function(f){try{f();}catch(e){}});CLOUD.unsub=[];CLOUD.ready=false;}
function cloudStart(){
  cloudStop();setCloudState("loading");
  metaRef().get().then(function(meta){
    if(meta.exists&&meta.data()&&meta.data().settings){return cloudLoadAll().then(function(){cloudListen();});}
    /* empty cloud: this device's data becomes the cloud copy */
    return cloudUploadAll(true).then(function(){cloudListen();toast("This device’s data has been uploaded to the cloud");});
  }).catch(function(e){setCloudState("error",friendlyErr(e));});
}
function friendlyErr(e){var m=(e&&(e.code||e.message))||String(e);
  if(/permission/i.test(m))return "Permission denied — check the Firestore rules and the business email";
  if(/unavailable|offline|network/i.test(m))return "Can’t reach the cloud — check internet";return m;}

/* full download: cloud replaces this device's copy */
function cloudLoadAll(){
  var jobs=CLOUD_COLLS.map(function(n){return cref(n).get().then(function(q){return [n,q];});});
  jobs.push(cref("photos").get().then(function(q){return ["photos",q];}));
  jobs.push(cref("attendance").get().then(function(q){return ["attendance",q];}));
  jobs.push(metaRef().get().then(function(d){return ["meta",d];}));
  return Promise.all(jobs).then(function(res){
    var photos={},att={},last={};
    res.forEach(function(r){
      var n=r[0],q=r[1];
      if(n==="meta"){var m=q.data()||{};if(m.settings)DB.settings=m.settings;DB.sample=!!m.sample;last.meta=JSON.stringify(settingsForCloud());return;}
      if(n==="photos"){last.photos={};q.forEach(function(d){photos[d.id]=d.data().data||"";last.photos[d.id]=photoSig(photos[d.id]);});return;}
      if(n==="attendance"){last.attendance={};q.forEach(function(d){att[d.id]=d.data().p||{};last.attendance[d.id]=JSON.stringify(att[d.id]);});return;}
      var arr=[];last[n]={};q.forEach(function(d){var o=d.data();arr.push(o);last[n][d.id]=JSON.stringify(o);});DB[n]=arr;
    });
    DB.washes.forEach(function(w){w.photo=photos[w.id]||"";});
    DB.attendance=att;
    migrateSoap();if(!DB.users||!DB.users.length)DB.users=[{id:uid(),username:"admin",password:"admin123",role:"admin",name:"Administrator",staffId:null}];
    CLOUD.last=last;CLOUD.ready=true;persist();
    setCloudState(navigator.onLine===false?"offline":"synced");
    ME=sessionUser();if(ME)route();else boot();
  });
}
/* upload everything (first connection, or "replace cloud with this device") */
function cloudUploadAll(fresh){
  if(fresh){CLOUD.last={meta:"",photos:{},attendance:{}};CLOUD_COLLS.forEach(function(n){CLOUD.last[n]={};});}
  CLOUD.ready=true;
  return cloudPush(true);
}
/* work out what changed since the last sync and write only that */
function cloudOps(){
  var ops=[],L=CLOUD.last;
  CLOUD_COLLS.forEach(function(n){
    var cur={};(DB[n]||[]).forEach(function(x){if(!x||!x.id)return;var o=n==="washes"?washForCloud(x):clean(x);cur[x.id]=o;});
    var prev=L[n]||{};
    Object.keys(cur).forEach(function(id){var j=JSON.stringify(cur[id]);if(prev[id]!==j)ops.push({t:"set",ref:cref(n).doc(id),data:cur[id],n:n,id:id,j:j});});
    Object.keys(prev).forEach(function(id){if(!cur[id])ops.push({t:"del",ref:cref(n).doc(id),n:n,id:id});});
  });
  var pc={};DB.washes.forEach(function(w){if(w.photo)pc[w.id]=w.photo;});var pp=L.photos||{};
  Object.keys(pc).forEach(function(id){var sg=photoSig(pc[id]);if(pp[id]!==sg)ops.push({t:"set",ref:cref("photos").doc(id),data:{data:pc[id]},n:"photos",id:id,j:sg});});
  Object.keys(pp).forEach(function(id){if(!pc[id])ops.push({t:"del",ref:cref("photos").doc(id),n:"photos",id:id});});
  var ac=DB.attendance||{},pa=L.attendance||{};
  Object.keys(ac).forEach(function(k){var j=JSON.stringify(ac[k]);if(pa[k]!==j)ops.push({t:"set",ref:cref("attendance").doc(k),data:{p:clean(ac[k])},n:"attendance",id:k,j:j});});
  Object.keys(pa).forEach(function(k){if(!ac[k])ops.push({t:"del",ref:cref("attendance").doc(k),n:"attendance",id:k});});
  var mj=JSON.stringify(settingsForCloud());
  if(L.meta!==mj)ops.push({t:"set",ref:metaRef(),data:Object.assign(settingsForCloud(),{updated:new Date().toISOString()}),n:"meta",j:mj});
  return ops;
}
function cloudPush(force){
  if(!CLOUD.db||!CLOUD.user||!CLOUD.ready)return Promise.resolve();
  var ops=cloudOps();if(!ops.length){if(CLOUD.state==="saving")setCloudState(navigator.onLine===false?"offline":"synced");return Promise.resolve();}
  setCloudState(navigator.onLine===false?"offline":"saving");
  /* mark as sent straight away so a second save doesn't resend */
  ops.forEach(function(o){var L=CLOUD.last;if(o.n==="meta"){L.meta=o.j;return;}L[o.n]=L[o.n]||{};if(o.t==="set")L[o.n][o.id]=o.j;else delete L[o.n][o.id];});
  var chunks=[];for(var i=0;i<ops.length;i+=400)chunks.push(ops.slice(i,i+400));
  CLOUD.pending++;
  ops.forEach(function(o){var k=o.n+"/"+(o.id||"");CLOUD.inflight[k]=(CLOUD.inflight[k]||0)+1;});
  function done(){ops.forEach(function(o){var k=o.n+"/"+(o.id||"");if(--CLOUD.inflight[k]<=0)delete CLOUD.inflight[k];});}
  var p=Promise.resolve();
  chunks.forEach(function(ch){p=p.then(function(){var b=CLOUD.db.batch();ch.forEach(function(o){if(o.t==="set")b.set(o.ref,o.data);else b.delete(o.ref);});return b.commit();});});
  return p.then(function(){CLOUD.pending--;setTimeout(done,600);if(!CLOUD.pending)setCloudState("synced");})
    .catch(function(e){CLOUD.pending--;done();
      /* forget what we thought was sent so the next save retries */
      ops.forEach(function(o){var L=CLOUD.last;if(o.n==="meta"){L.meta="";return;}if(L[o.n])delete L[o.n][o.id];});
      setCloudState("error",friendlyErr(e));toast("Cloud save failed — "+friendlyErr(e));});
}
function cloudPushSoon(ms){clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(function(){cloudPush();},ms==null?250:ms);}

/* ---- live updates from other phones ---- */
function cloudListen(){
  function apply(n,snap){
    var changed=false;
    snap.docChanges().forEach(function(ch){
      if(ch.doc.metadata.hasPendingWrites)return;
      var id=ch.doc.id,L=CLOUD.last;
      if(CLOUD.inflight[n+"/"+id])return; /* our own upload for this record is still on its way */
      if(n==="photos"){var ph=ch.type==="removed"?"":(ch.doc.data().data||"");L.photos=L.photos||{};
        var lw=DB.washes.find(function(x){return x.id===id;});if(photoSig(lw&&lw.photo||"")!==(L.photos[id]||"")&&(lw||L.photos[id]!==undefined))return; /* unsent local photo change wins */
        if(ch.type==="removed")delete L.photos[id];else L.photos[id]=photoSig(ph);
        var w=DB.washes.find(function(x){return x.id===id;});if(w&&w.photo!==ph){w.photo=ph;changed=true;}return;}
      if(n==="attendance"){L.attendance=L.attendance||{};
        var la=DB.attendance[id]?JSON.stringify(DB.attendance[id]):undefined;if(la!==L.attendance[id])return; /* unsent local change wins */
        if(ch.type==="removed"){if(DB.attendance[id]){delete DB.attendance[id];changed=true;}delete L.attendance[id];}
        else{var p=ch.doc.data().p||{},j=JSON.stringify(p);if(JSON.stringify(DB.attendance[id]||null)!==j){DB.attendance[id]=p;changed=true;}L.attendance[id]=j;}return;}
      L[n]=L[n]||{};var arr=DB[n]||(DB[n]=[]),idx=arr.findIndex(function(x){return x.id===id;});
      var localJ=idx>=0?JSON.stringify(n==="washes"?washForCloud(arr[idx]):clean(arr[idx])):undefined;
      if(localJ!==L[n][id])return; /* this device has a newer change not yet uploaded — keep it, it will be sent */
      if(ch.type==="removed"){if(idx>=0){arr.splice(idx,1);changed=true;}delete L[n][id];return;}
      var o=ch.doc.data(),j=JSON.stringify(o);L[n][id]=j;
      if(n==="washes"&&idx>=0)o.photo=arr[idx].photo||"";
      if(idx<0){if(n==="washes")o.photo="";arr.push(o);changed=true;}
      else{var curJ=JSON.stringify(n==="washes"?washForCloud(arr[idx]):arr[idx]);if(curJ!==j){arr[idx]=o;changed=true;}}
    });
    if(changed){persist();cloudRerender();}
  }
  CLOUD_COLLS.concat(["photos","attendance"]).forEach(function(n){
    CLOUD.unsub.push(cref(n).onSnapshot({includeMetadataChanges:false},function(s){apply(n,s);},function(e){setCloudState("error",friendlyErr(e));}));
  });
  CLOUD.unsub.push(metaRef().onSnapshot(function(d){
    if(d.metadata.hasPendingWrites||!d.exists||CLOUD.inflight["meta/"])return;var m=d.data()||{};if(!m.settings)return;
    if(JSON.stringify(settingsForCloud())!==CLOUD.last.meta&&CLOUD.last.meta)return; /* unsent local settings win */
    var j=JSON.stringify(clean({settings:m.settings,sample:!!m.sample}));
    if(j!==JSON.stringify(settingsForCloud())){DB.settings=m.settings;DB.sample=!!m.sample;migrateSoap();CLOUD.last.meta=j;persist();cloudRerender();}else CLOUD.last.meta=j;
  }));
  setCloudState(navigator.onLine===false?"offline":"synced");
}
/* refresh the screen for remote changes, but never while someone is typing or a form is open */
function cloudRerender(){
  clearTimeout(CLOUD.renderTimer);
  CLOUD.renderTimer=setTimeout(function tryR(){
    var ae=document.activeElement,typing=ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName);
    var busy=document.getElementById("modalroot").innerHTML!==""||typing||(CAM&&CAM.stream)||(curPage&&ME&&curPage()==="record");
    if(busy){CLOUD.renderTimer=setTimeout(tryR,2000);return;}

    ME=sessionUser();if(!ME){boot();return;}route();
