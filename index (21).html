/* ---- device sign-in gate ---- */
function showCloudGate(){
  var g=document.getElementById("cloudgate");if(!g){g=document.createElement("div");g.id="cloudgate";document.body.appendChild(g);}
  var c=cloudConfig();
  g.innerHTML='<div class="auth-wrap" style="position:fixed;inset:0;z-index:150;background:var(--bg)"><div class="auth-card">'+
    '<div class="auth-head"><div class="auth-logo">'+document.getElementById("logo").innerHTML+'</div><div><b>Connect this device</b><small>Eyez Autos cloud · '+esc(c?c.cfg.projectId:"")+'</small></div></div>'+
    '<div class="faint" style="font-size:13px;margin-bottom:12px">Sign in once with the business cloud account so this phone saves to, and sees, the same records as every other device.</div>'+
    '<div class="field"><label class="f">Business email</label><input id="cg_email" type="email" autocomplete="username" placeholder="e.g. eyezautos@gmail.com"></div>'+
    '<div class="field"><label class="f">Cloud password</label><input id="cg_pass" type="password" autocomplete="current-password"></div>'+
    '<div class="faint" id="cg_err" style="color:var(--bad);font-size:13px;margin-bottom:8px" hidden></div>'+
    '<button class="btn primary" id="cg_go" style="width:100%">Connect</button>'+
    '<button class="btn ghost" id="cg_skip" style="width:100%;margin-top:8px">Use without cloud for now</button>'+
    '<div class="auth-hint">This is the Firebase account (email &amp; password) the owner created. Staff then log in with their own username as usual.</div></div></div>';
  function err(m){var e=document.getElementById("cg_err");e.textContent=m;e.hidden=false;}
  document.getElementById("cg_go").onclick=function(){
    var em=document.getElementById("cg_email").value.trim(),pw=document.getElementById("cg_pass").value;
    if(!em||!pw){err("Enter the email and password.");return;}
    var b=document.getElementById("cg_go");b.disabled=true;b.textContent="Connecting…";
    CLOUD.auth.signInWithEmailAndPassword(em,pw).catch(function(e){b.disabled=false;b.textContent="Connect";
      var c=e&&e.code||"";err(/wrong-password|invalid-credential|user-not-found|invalid-login/.test(c)?"Email or password is not correct.":/network/.test(c)?"No internet connection.":/too-many/.test(c)?"Too many tries — wait a minute.":(e.message||c));});
  };
  document.getElementById("cg_pass").onkeydown=function(e){if(e.key==="Enter")document.getElementById("cg_go").click();};
  document.getElementById("cg_skip").onclick=function(){try{sessionStorage.setItem("eyez_cloudskip","1");}catch(e){}hideCloudGate();};
}
function hideCloudGate(){var g=document.getElementById("cloudgate");if(g)g.remove();}

/* ---- Admin Settings card ---- */
function cloudCardHtml(){
  var c=cloudConfig(),st=CLOUD.state;
  var h='<div class="card pad" style="margin-bottom:16px"><div class="sec-h" style="margin:0 0 12px"><h3>Cloud backup (Firebase)</h3><div class="grow"></div><span class="cloudchip" style="pointer-events:none">'+(document.getElementById("cloudchip")||{}).innerHTML+'</span></div>';
  if(!c){
    h+='<div class="faint" style="font-size:13px;margin-bottom:10px">Not connected: data is saved on this device only. Paste your Firebase web app config below to save everything to the cloud and share it across phones.</div>'+
      '<div class="field"><label class="f">Firebase config</label><textarea id="fb_cfg" rows="6" style="font-family:var(--mono);font-size:12px" placeholder="const firebaseConfig = {\n  apiKey: &quot;...&quot;,\n  authDomain: &quot;...&quot;,\n  projectId: &quot;...&quot;,\n  ...\n};"></textarea></div>'+
      '<button class="btn primary" id="fb_save">Save & connect</button>';
  }else{
    h+='<div style="display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;margin-bottom:12px">'+
      '<span class="faint">Project</span><b>'+esc(c.cfg.projectId)+'</b>'+
      '<span class="faint">Signed in as</span><b>'+(CLOUD.user?esc(CLOUD.user.email||"(account)"):'<span style="color:var(--bad)">not signed in</span>')+'</b>'+
      '<span class="faint">Status</span><b>'+esc((st==="error"?"Error — "+CLOUD.err:{off:"Off",loading:"Connecting…",signin:"Sign-in needed",synced:"All changes saved",saving:"Saving…",offline:"Offline — changes will upload when online"}[st])||st)+'</b>'+
      '<span class="faint">Config from</span><b>'+(c.src==="file"?"built into the app file":"pasted on this device")+'</b></div>'+
      '<div class="inline" style="gap:8px">'+
      (CLOUD.user?'<button class="btn" id="fb_sync">Sync now</button><button class="btn" id="fb_reload">Reload from cloud</button><button class="btn" id="fb_upload">Replace cloud with this device</button><button class="btn danger" id="fb_out">Disconnect this device</button>':
        '<button class="btn primary" id="fb_in">Sign in this device</button>')+
      (c.src==="device"?'<button class="btn ghost" id="fb_forget">Remove config</button>':'')+'</div>'+
      '<div class="faint" style="font-size:12px;margin-top:10px">Changes save to the cloud automatically a moment after each entry. Works offline too — it uploads when the internet comes back.</div>';
  }
  return h+'</div>';
}
function bindCloudCard(){
  var b;
  if((b=document.getElementById("fb_save")))b.onclick=function(){var cfg=parseConfig(document.getElementById("fb_cfg").value);
    if(!cfg){toast("That doesn’t look like a Firebase config");return;}
    try{localStorage.setItem("eyez_fbcfg",JSON.stringify(cfg));}catch(e){}try{sessionStorage.removeItem("eyez_cloudskip");}catch(e){}
    toast("Config saved — connecting…");if(CLOUD.auth){location.reload();}else{cloudInit();setTimeout(function(){VIEWS.admin();},800);}};
  if((b=document.getElementById("fb_sync")))b.onclick=function(){cloudPush().then(function(){toast("Synced");VIEWS.admin();});};
  if((b=document.getElementById("fb_reload")))b.onclick=function(){confirmModal("Reload from cloud?","This device’s copy will be replaced by the cloud copy.",function(){setCloudState("loading");cloudStop();cloudLoadAll().then(function(){cloudListen();toast("Reloaded from cloud");});});};
  if((b=document.getElementById("fb_upload")))b.onclick=function(){confirmModal("Replace the cloud copy?","Everything in the cloud will be made the same as this device. Records that exist only in the cloud will be deleted. Use this only if this device has the correct data.",function(){
    CLOUD.last={meta:"",photos:{},attendance:{}};CLOUD_COLLS.forEach(function(n){CLOUD.last[n]={};});
    /* also delete cloud docs this device doesn't have */
    var jobs=CLOUD_COLLS.concat(["photos","attendance"]).map(function(n){return cref(n).get().then(function(q){q.forEach(function(d){CLOUD.last[n][d.id]="__x";});});});
    Promise.all(jobs).then(function(){return cloudPush(true);}).then(function(){toast("Cloud replaced with this device’s data");VIEWS.admin();});});};
  if((b=document.getElementById("fb_out")))b.onclick=function(){confirmModal("Disconnect this device?","It will stop syncing until someone signs in again. Data already on the phone stays.",function(){CLOUD.auth.signOut();});};
  if((b=document.getElementById("fb_in")))b.onclick=function(){try{sessionStorage.removeItem("eyez_cloudskip");}catch(e){}if(CLOUD.auth)showCloudGate();else cloudInit();};
  if((b=document.getElementById("fb_forget")))b.onclick=function(){confirmModal("Remove cloud config?","This device will stop syncing. Data already on the phone stays.",function(){try{localStorage.removeItem("eyez_fbcfg");}catch(e){}location.reload();});};
}

document.getElementById("printbtn").onclick=printPage;
document.getElementById("cloudchip").onclick=function(){if(isAdmin())go("admin");else toast(this.title||"Cloud status");};

setTheme(DB.theme||null);
if(!DB.theme){try{window.matchMedia("(prefers-color-scheme:dark)").addEventListener("change",function(){if(!DB.theme)setTheme(null);});}catch(e){}}
boot();
renderCloudChip();cloudInit();
</script>
</body>
</html>
